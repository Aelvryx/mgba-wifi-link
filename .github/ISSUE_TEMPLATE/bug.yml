name: Bug report
description: Record a reproducible defect in the GBA Wi-Fi Link fork
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This form remains available for people who independently choose to use it.
        Include only bounded, non-sensitive facts. Do not upload commercial ROMs,
        BIOS files, private saves, IP addresses, private paths, or raw controller
        histories. Do not upload, attach, or paste endpoint, core, or RetroArch
        logs until issue #20 provides a sanitized diagnostic workflow.
  - type: input
    id: build
    attributes:
      label: Fork build
      description: Release tag or full commit, plus core SHA-256 for an unpublished build.
    validations:
      required: true
  - type: input
    id: frontend
    attributes:
      label: Frontend and platform
      description: RetroArch version and platform or OS. Do not include device identifiers.
    validations:
      required: true
  - type: input
    id: content
    attributes:
      label: Game identity
      description: Title and region/revision or a redistributable fixture. Do not attach the ROM.
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Failure phase
      options:
        - Installation or core loading
        - Host/join or attachment
        - Game cable discovery
        - Active gameplay
        - Disconnect or teardown
        - Saving or persistence
        - Other
    validations:
      required: true
  - type: input
    id: connection
    attributes:
      label: Endpoint roles and network type
      description: Host/client roles and trusted LAN or direct Android hotspot only; do not include addresses.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: visible-message
    attributes:
      label: Last visible message
      description: Enter the last visible message, if any. Do not paste logs or attach log files.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I used identical ROM bytes on both endpoints.
          required: true
        - label: I removed commercial content, saves, addresses, paths, and input history from the report.
          required: true
        - label: I did not include endpoint, core, or RetroArch logs; issue #20 has not yet published a sanitized workflow.
          required: true
