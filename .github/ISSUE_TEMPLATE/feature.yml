name: Feature record
description: Record a scoped possible improvement to GBA Wi-Fi Link
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This form remains available for people who independently choose to use it.
        Do not include commercial ROMs, BIOS files, private saves, addresses,
        private paths, or raw controller histories.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user outcome, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Correctness, compatibility, and failure tradeoffs
  - type: dropdown
    id: horizon
    attributes:
      label: Roadmap horizon
      options:
        - Now
        - Next
        - Later / research
        - Not sure
    validations:
      required: true
