name: GBA Wi-Fi Link

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact peeled source commit supplied by a reusable caller
        required: false
        type: string
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: gba-wifi-link-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-normal-suite:
    name: Complete normal mGBA suite
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build pkg-config libcmocka-dev

      - name: Configure complete suite
        run: |
          cmake -S . -B build-ci-complete -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_LIBRETRO=ON \
            -DBUILD_TEST=ON -DBUILD_SUITE=ON -DBUILD_CINEMA=OFF \
            -DBUILD_HEADLESS=OFF -DBUILD_EXAMPLE=OFF \
            -DUSE_ZLIB=OFF -DUSE_MINIZIP=OFF -DUSE_PNG=OFF \
            -DUSE_LIBZIP=OFF -DUSE_SQLITE3=OFF -DUSE_LZMA=OFF \
            -DUSE_JSON_C=OFF -DUSE_FREETYPE=OFF -DUSE_FFMPEG=OFF \
            -DUSE_ELF=OFF -DUSE_LUA=OFF -DENABLE_SCRIPTING=OFF \
            -DUSE_DISCORD_RPC=OFF

      - name: Build complete suite
        run: cmake --build build-ci-complete --parallel 2

      - name: Run all tests except pinned upstream failure
        run: |
          ctest --test-dir build-ci-complete --output-on-failure \
            --exclude-regex '^util-hash$' --parallel 2

      - name: Confirm pinned upstream util-hash baseline
        shell: bash
        run: |
          set +e
          output="$(ctest --test-dir build-ci-complete \
            --output-on-failure --tests-regex '^util-hash$' 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep --fixed-strings 'stagedCrc32' <<<"$output"
          grep --fixed-strings '0% tests passed, 1 tests failed out of 1' \
            <<<"$output"

  focused-tests:
    name: Focused tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            build_dir: build-ci
            sanitizers: none
          - name: ASan + UBSan
            build_dir: build-ci-sanitize
            sanitizers: address,undefined
          - name: TSan
            build_dir: build-ci-tsan
            sanitizers: thread

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build pkg-config libcmocka-dev

      - name: Configure focused suite
        shell: bash
        run: |
          sanitizer_flags=()
          if [[ "${{ matrix.sanitizers }}" != "none" ]]; then
            sanitizer_flags+=(
              -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.sanitizers }} -fno-omit-frame-pointer"
              -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizers }} -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizers }}"
              -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizers }}"
            )
          fi

          cmake -S . -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_LIBRETRO=ON \
            -DBUILD_TEST=ON -DBUILD_SUITE=ON -DBUILD_CINEMA=OFF \
            -DBUILD_HEADLESS=OFF -DBUILD_EXAMPLE=OFF \
            -DUSE_ZLIB=OFF -DUSE_MINIZIP=OFF -DUSE_PNG=OFF \
            -DUSE_LIBZIP=OFF -DUSE_SQLITE3=OFF -DUSE_LZMA=OFF \
            -DUSE_JSON_C=OFF -DUSE_FREETYPE=OFF -DUSE_FFMPEG=OFF \
            -DUSE_ELF=OFF -DUSE_LUA=OFF -DENABLE_SCRIPTING=OFF \
            -DUSE_DISCORD_RPC=OFF \
            "${sanitizer_flags[@]}"

      - name: Build focused suite
        run: |
          cmake --build "${{ matrix.build_dir }}" --parallel 2 --target \
            test-gba-netplay-identity \
            test-gba-netplay-input-sync \
            test-gba-netplay-protocol-v2 \
            test-gba-netplay-rtc-sync \
            test-gba-netplay-session-v2 \
            test-gba-netplay-transport \
            test-gba-replica \
            test-gba-replicated-pair \
            test-gba-replicated-pair-scheduler \
            test-gba-sio \
            test-libretro-replicated-pair-frontend \
            test-libretro-gba-wifi-link \
            test-libretro-gba-wifi-link-replay

      - name: Run focused suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: exitcode=23
          TSAN_OPTIONS: halt_on_error=1:history_size=7
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir "${{ matrix.build_dir }}" \
            --output-on-failure \
            --tests-regex 'gba-netplay|gba-replica|gba-sio|libretro-gba-wifi-link|libretro-replicated-pair-frontend' \
            --parallel 2

  fixture:
    name: Fixture reproducibility
    runs-on: ubuntu-24.04
    env:
      ARM_TOOLCHAIN_ARCHIVE: arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
      ARM_TOOLCHAIN_SHA256: 597893282ac8c6ab1a4073977f2362990184599643b4c5ee34870a8215783a16

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install boundary-audit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build pkg-config libcmocka-dev

      - name: Download pinned GNU Arm toolchain
        run: |
          curl --fail --location --retry 3 \
            --output "/tmp/${ARM_TOOLCHAIN_ARCHIVE}" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/${ARM_TOOLCHAIN_ARCHIVE}"
          echo "${ARM_TOOLCHAIN_SHA256}  /tmp/${ARM_TOOLCHAIN_ARCHIVE}" \
            | sha256sum --check -
          mkdir -p /tmp/gba-link-arm-toolchain
          tar -xJf "/tmp/${ARM_TOOLCHAIN_ARCHIVE}" \
            -C /tmp/gba-link-arm-toolchain --strip-components=1

      - name: Rebuild and compare test-ROM fixture
        run: |
          make -C tools/gba-link-test-rom verify-fixture \
            CROSS=/tmp/gba-link-arm-toolchain/bin/arm-none-eabi-

      - name: Validate structured-log analyzers
        run: |
          python3 tools/test-analyze-gba-wifi-link.py

      - name: Validate GBA Wi-Fi Link product boundary
        run: |
          python3 tools/test-audit-gba-wifi-link-boundary.py
          cmake -S . -B build-ci-boundary -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_LIBRETRO=ON \
            -DBUILD_TEST=ON -DBUILD_SUITE=ON -DBUILD_CINEMA=OFF \
            -DBUILD_HEADLESS=OFF -DBUILD_EXAMPLE=OFF
          python3 tools/audit-gba-wifi-link-boundary.py \
            --build-dir build-ci-boundary

      - name: Validate Android qualification helper
        run: |
          bash -n tools/four-swords-discovery/android-qualification.sh
          python3 tools/four-swords-discovery/test-qualification-helper.py

  android-arm64:
    name: Android arm64 libretro build
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 27.2.12479018

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install build tools and pinned NDK
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android arm64 core
        env:
          # Do not let host pkg-config metadata add x86-64 library paths to
          # the Android link. Dependencies must come from the NDK sysroot or
          # the source-tree fallbacks selected by CMake.
          PKG_CONFIG_LIBDIR: /tmp/mgba-empty-pkgconfig
          PKG_CONFIG_PATH: ""
        run: |
          mkdir -p "$PKG_CONFIG_LIBDIR"
          cmake -S . -B build-ci-android-arm64 -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_LIBRETRO=ON \
            -DBUILD_TEST=OFF -DBUILD_SUITE=OFF -DBUILD_CINEMA=OFF \
            -DBUILD_HEADLESS=OFF -DBUILD_EXAMPLE=OFF

      - name: Build and inspect Android arm64 core
        run: |
          cmake --build build-ci-android-arm64 --parallel 2 \
            --target mgba_libretro
          test -s build-ci-android-arm64/mgba_libretro.so
          file build-ci-android-arm64/mgba_libretro.so \
            | grep --fixed-strings 'ARM aarch64'
          python3 tools/audit-gba-wifi-link-boundary.py \
            --binary-only \
            --binary build-ci-android-arm64/mgba_libretro.so

      - name: Write canonical Android build metadata
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          core = Path("build-ci-android-arm64/mgba_libretro.so")
          with core.open("rb") as core_file:
              core_sha256 = hashlib.file_digest(core_file, "sha256").hexdigest()
          metadata = {
              "actions": {
                  "actions/checkout": {
                      "sha": "d23441a48e516b6c34aea4fa41551a30e30af803",
                      "version": "v6",
                  },
                  "actions/upload-artifact": {
                      "sha": "ea165f8d65b6e75b540449e92b4886f43607fa02",
                      "version": "v4",
                  },
              },
              "android_abi": "arm64-v8a",
              "android_api": "21",
              "core": {
                  "name": core.name,
                  "sha256": core_sha256,
                  "size": core.stat().st_size,
              },
              "ndk_version": "27.2.12479018",
              "schema": 1,
              "source_ref": os.environ["SOURCE_REF"],
          }
          (core.parent / "BUILD-METADATA.json").write_text(
              json.dumps(metadata, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload inspected Android ARM64 release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gba-wifi-link-android-arm64-release-input
          path: |
            build-ci-android-arm64/mgba_libretro.so
            build-ci-android-arm64/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 7
