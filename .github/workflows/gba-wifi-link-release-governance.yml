name: GBA Wi-Fi Link release governance

on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  ruleset-audit:
    name: Audit immutable release-tag policy
    runs-on: ubuntu-24.04
    environment: gba-wifi-link-release-governance
    steps:
      - name: Check out protected governance source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Read the complete immutable ruleset
        env:
          GBA_WIFI_LINK_RULESET_AUDIT_TOKEN: ${{ secrets.GBA_WIFI_LINK_RULESET_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GBA_WIFI_LINK_RULESET_AUDIT_TOKEN"
          python3 tools/gba-wifi-link-release.py verify-tag-policy
