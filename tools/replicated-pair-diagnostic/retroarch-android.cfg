# Isolated Android configuration for the local replicated-pair performance
# gate. It is passed through the RetroActivity intent and never replaces the
# user's normal RetroArch configuration.
video_driver = "gl"
video_threaded = "false"
video_vsync = "true"
audio_driver = "opensl"
audio_enable = "true"
audio_sync = "true"
autosave_interval = "0"
input_driver = "android"
joypad_driver = "android"
input_overlay_enable = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
config_save_on_exit = "false"
core_options_path = "/sdcard/Android/data/com.retroarch.aarch64/files/mgba-replicated-pair-diagnostic/core-options.cfg"
savefile_directory = "/sdcard/Android/data/com.retroarch.aarch64/files/mgba-replicated-pair-diagnostic/saves"
savestate_directory = "/sdcard/Android/data/com.retroarch.aarch64/files/mgba-replicated-pair-diagnostic/states"
log_verbosity = "true"
frontend_log_level = "1"
libretro_log_level = "1"
log_to_file = "true"
log_dir = "/sdcard/Android/data/com.retroarch.aarch64/files/mgba-replicated-pair-diagnostic/logs"
performance_counters_enable = "true"
network_cmd_enable = "true"
network_cmd_port = "55355"
